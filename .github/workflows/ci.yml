name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mods:
    name: Python and JavaScript checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install pytest==9.2.0 ruff==0.17.5 mypy==2.4.1
      - run: python -m pytest -q tests
      - run: python -m ruff check scripts tests
      - run: python -m mypy --python-version 3.14 --explicit-package-bases mods/taktik/journal.py tests
      - run: node --test tests/*.test.cjs
      - run: node --test integrations/herdr-gitview/herdr-app/test/*.test.mjs

  gitview:
    name: Gitview (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    defaults:
      run:
        working-directory: integrations/herdr-gitview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: git config --global init.defaultBranch main
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked
      - name: Build and package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add --toolchain stable "$TARGET"
          cargo +stable build --release --locked --target "$TARGET"
          herdr-app/bundle.sh "target/$TARGET/release/herdr-gitview" "$TARGET" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitview-${{ matrix.target }}
          path: integrations/herdr-gitview/dist/herdr-gitview-app-${{ matrix.target }}.tar.gz*
          if-no-files-found: error
